# Mumble Web 一键部署（前后端分离：web = 静态页面，proxy = Go 代理）
# 用法：
#   cp .env.example .env   # 按需修改
#   docker compose up -d
#
# 无数据库；仅挂载 ./diag 存放前端诊断上报（diag.jsonl）。
#
# 默认单主机部署：浏览器 -> web(8080) -> nginx 同源回退 -> proxy(8081)。
# 分离迁移时：把 web / proxy 放到不同主机，在 web 侧设置 PROXY_ORIGIN 指向
# proxy 的对外地址（如 http://proxy.example.com:8081），浏览器跨源直连代理；
# 无论哪种方式，语音 UDP（默认 50000）始终由浏览器直连 proxy 主机。

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建版本标识（git sha），注入到二进制的 main.version；
        # 用法：VERSION=$(git rev-parse --short HEAD) docker compose build
        VERSION: ${VERSION:-dev}
    image: mumble-web-proxy:latest
    container_name: mumble-web-proxy
    restart: unless-stopped
    # host 网络：WebRTC 语音走 UDP，docker 端口映射（docker-proxy/NAT）在部分平台
    # （如 WSL2）不转发 UDP，会导致浏览器↔代理的 ICE 连通性检查失败、语音双向不通。
    # host 模式下端口由 LISTEN / RTC_UDP_PORT 环境变量直接决定，无需 ports 映射。
    network_mode: host
    environment:
      LISTEN: ":${PROXY_PORT:-8081}"
      MUMBLE_SERVER: ${MUMBLE_SERVER:-localhost:64738}
      MUMBLE_TLS: ${MUMBLE_TLS:-verify}
      RTC_UDP_PORT: "${RTC_UDP_PORT:-50000}"
      RTC_PUBLIC_IP: ${RTC_PUBLIC_IP:-}
      ALLOW_SERVER_OVERRIDE: ${ALLOW_SERVER_OVERRIDE:-true}
      WEB_INVITE_ENABLED: ${WEB_INVITE_ENABLED:-true}
      INVITE_SECRET: ${INVITE_SECRET:-}
      INVITE_TTL: ${INVITE_TTL:-30m}
      FRONTEND_URL: ${FRONTEND_URL:-}
      DIAG_DIR: /app/diag
    volumes:
      # 诊断上报落盘（diag.jsonl），挂载到宿主机便于采集；建议保留 7 天
      - ./diag:/app/diag
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${PROXY_PORT:-8081}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: mumble-web:latest
    container_name: mumble-web
    restart: unless-stopped
    # 页面是纯静态文件，但 nginx 需要回源到 host 网络的 proxy；
    # 用 host 网络避免 docker 自定义网桥被宿主机防火墙（如 firewalld）拦截的坑。
    # 对外端口由 WEB_PORT（即 .env 的 PORT）决定，无需 ports 映射。
    network_mode: host
    environment:
      # web 对外监听端口（浏览器访问入口）
      WEB_PORT: ${PORT:-8080}
      # 留空：浏览器经本容器 nginx 同源访问代理（单主机默认）
      # 非空：浏览器跨源直连该地址的代理（分离部署；web 为 HTTPS 时这里必须 https）
      PROXY_ORIGIN: ${PROXY_ORIGIN:-}
      # 同源回退时 nginx 转发目标；同机部署走回环即可
      PROXY_UPSTREAM: ${PROXY_UPSTREAM:-127.0.0.1:${PROXY_PORT:-8081}}
    depends_on:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
