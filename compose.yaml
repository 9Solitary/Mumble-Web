# Mumble Web 一键部署
# 用法：
#   cp .env.example .env   # 按需修改
#   docker compose up -d
#
# 无数据库、无状态、无需 Volume。

services:
  mumble-web:
    build: .
    image: mumble-web:latest
    container_name: mumble-web
    restart: unless-stopped
    # host 网络：WebRTC 语音走 UDP，docker 端口映射（docker-proxy/NAT）在部分平台
    # （如 WSL2）不转发 UDP，会导致浏览器↔代理的 ICE 连通性检查失败、语音双向不通。
    # host 模式下端口由 LISTEN / RTC_UDP_PORT 环境变量直接决定，无需 ports 映射。
    network_mode: host
    environment:
      LISTEN: ":${PORT:-8080}"
      STATIC_DIR: /app/dist
      MUMBLE_SERVER: ${MUMBLE_SERVER:-localhost:64738}
      MUMBLE_TLS: ${MUMBLE_TLS:-verify}
      RTC_UDP_PORT: "${RTC_UDP_PORT:-50000}"
      RTC_PUBLIC_IP: ${RTC_PUBLIC_IP:-}
      ALLOW_SERVER_OVERRIDE: ${ALLOW_SERVER_OVERRIDE:-true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
